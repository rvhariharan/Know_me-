<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/><stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="48" fill="url(#grad)" />
  <circle cx="200" cy="180" r="110" fill="#ec4899" opacity="0.25" filter="url(#glow)" />
  <circle cx="200" cy="180" r="85" fill="#ec4899" opacity="0.18" />
  
  <!-- Main Illustration / Graphic -->
  <g transform="translate(0, 0)">
    <circle cx="180" cy="240" r="8" fill="#3b0764"/><circle cx="200" cy="245" r="8" fill="#3b0764"/><circle cx="220" cy="240" r="8" fill="#3b0764"/>
  </g>
  
  <!-- Decorative sparkles -->
  <path d="M 80 90 Q 80 105 65 105 Q 80 105 80 120 Q 80 105 95 105 Q 80 105 80 90 Z" fill="#ffd166" opacity="0.8" />
  <path d="M 330 90 Q 330 105 315 105 Q 330 105 330 120 Q 330 105 345 105 Q 330 105 330 90 Z" fill="#ffd166" opacity="0.8" />
  <circle cx="310" cy="270" r="5" fill="#f472b6" opacity="0.7" />
  <circle cx="90" cy="270" r="4" fill="#a78bfa" opacity="0.7" />

  <!-- Emoji Badge -->
  <text x="200" y="205" font-size="88" text-anchor="middle" dominant-baseline="central">🧋</text>
  
  <!-- Title Badge -->
  <rect x="70" y="310" width="260" height="52" rx="26" fill="#0b0e1d" opacity="0.75" stroke="#ec4899" stroke-width="1.5" />
  <text x="200" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Sweet Boba</text>
</svg>